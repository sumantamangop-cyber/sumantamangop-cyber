    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4C1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF4C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D7A1"/>
      <stop offset="100%" stop-color="#E3B778"/>
