<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD89B"/>
      <stop offset="45%" stop-color="#FF9A8B"/>
      <stop offset="75%" stop-color="#5B86C9"/>
      <stop offset="100%" stop-color="#19547B"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4C1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF4C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D7A1"/>
      <stop offset="100%" stop-color="#E3B778"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>

  <circle cx="1000" cy="80" r="90" fill="url(#sunGlow)"/>
  <circle cx="1000" cy="80" r="38" fill="#FFE29A">
    <animate attributeName="r" values="36;40;36" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.85" fill="#ffffff">
    <ellipse cx="180" cy="55" rx="38" ry="14"/>
    <ellipse cx="210" cy="50" rx="28" ry="12"/>
    <ellipse cx="150" cy="50" rx="24" ry="10"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="40s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.7" fill="#ffffff">
    <ellipse cx="650" cy="40" rx="30" ry="11"/>
    <ellipse cx="675" cy="36" rx="22" ry="9"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="55s" repeatCount="indefinite"/>
  </g>

  <!-- Far swell: broad, slow, smooth rolling waves -->
  <g>
    <g>
      <path d="M0,198 Q150,165 300,198 T600,198 T900,198 T1200,198 V300 H0 Z" fill="#1C6EA4" opacity="0.6"/>
      <path d="M1200,198 Q1350,165 1500,198 T1800,198 T2100,198 T2400,198 V300 H1200 Z" fill="#1C6EA4" opacity="0.6"/>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- Breaking wave band near shore, with curling crest -->
  <g>
    <g>
      <path d="M0,232 Q37.5,200 75,232 T150,232 T225,232 T300,232 T375,232 T450,232 T525,232 T600,232 T675,232 T750,232 T825,232 T900,232 T975,232 T1050,232 T1125,232 T1200,232 V300 H0 Z" fill="#2E86C1"/>
      <path d="M1200,232 Q1237.5,200 1275,232 T1350,232 T1425,232 T1500,232 T1575,232 T1650,232 T1725,232 T1800,232 T1875,232 T1950,232 T2025,232 T2100,232 T2175,232 T2250,232 T2325,232 T2400,232 V300 H1200 Z" fill="#2E86C1"/>

      <path d="M0,232 Q37.5,200 75,232 T150,232 T225,232 T300,232 T375,232 T450,232 T525,232 T600,232 T675,232 T750,232 T825,232 T900,232 T975,232 T1050,232 T1125,232 T1200,232"
            fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M1200,232 Q1237.5,200 1275,232 T1350,232 T1425,232 T1500,232 T1575,232 T1650,232 T1725,232 T1800,232 T1875,232 T1950,232 T2025,232 T2100,232 T2175,232 T2250,232 T2325,232 T2400,232"
            fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
      </path>

      <g fill="#ffffff">
        <circle cx="60" cy="210" r="3"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="140" cy="206" r="2.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
        <circle cx="220" cy="210" r="3.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="206" r="2.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
        <circle cx="380" cy="210" r="3"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="460" cy="206" r="2.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="540" cy="210" r="3.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle cx="620" cy="206" r="3"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="700" cy="210" r="2.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="1.1s" repeatCount="indefinite"/></circle>
        <circle cx="780" cy="206" r="3"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="1.4s" repeatCount="indefinite"/></circle>
        <circle cx="860" cy="210" r="3.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="940" cy="206" r="2.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle>
        <circle cx="1020" cy="210" r="3"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="1.0s" repeatCount="indefinite"/></circle>
        <circle cx="1100" cy="206" r="3.5"><animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="1.3s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="4.2s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="262" width="1200" height="38" fill="url(#sand)"/>
  <g fill="#C99A5B" opacity="0.5">
    <circle cx="90" cy="280" r="2.5"/>
    <circle cx="260" cy="288" r="2"/>
    <circle cx="430" cy="276" r="2.5"/>
    <circle cx="610" cy="286" r="2"/>
    <circle cx="790" cy="278" r="2.5"/>
    <circle cx="960" cy="288" r="2"/>
    <circle cx="1120" cy="276" r="2.5"/>
  </g>

  <!-- Foam wash sliding up and receding on the sand -->
  <g opacity="0.55">
    <path d="M0,268 Q50,258 100,268 T200,268 T300,268 T400,268 T500,268 T600,268 T700,268 T800,268 T900,268 T1000,268 T1100,268 T1200,268 V300 H0 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 20;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="4.2s" repeatCount="indefinite"/>
  </g>

  <!-- Palm tree, kept clear of the sun and the name text -->
  <defs>
    <path id="frond" d="M0,0 C-14,-24 -32,-52 -26,-82 C-16,-52 -4,-20 0,0 Z" fill="#2F6B3C"/>
  </defs>
  <g>
    <path d="M1140,297 Q1103,205 1120,115" stroke="#6B4226" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M1140,297 Q1103,205 1120,115" stroke="#8B5A2B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 1120 115;4 1120 115;-4 1120 115" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="3.2s" repeatCount="indefinite"/>
      <use href="#frond" transform="translate(1120,115) rotate(-80)"/>
      <use href="#frond" transform="translate(1120,115) rotate(-48)"/>
      <use href="#frond" transform="translate(1120,115) rotate(-16)"/>
      <use href="#frond" transform="translate(1120,115) rotate(16)"/>
      <use href="#frond" transform="translate(1120,115) rotate(48)"/>
      <use href="#frond" transform="translate(1120,115) rotate(80)"/>
    </g>
    <circle cx="1112" cy="118" r="4" fill="#5B3A1F"/>
    <circle cx="1124" cy="122" r="4" fill="#5B3A1F"/>
  </g>

  <text x="40" y="55" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" opacity="0">
    Xow
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.4;1" dur="4s" fill="freeze"/>
  </text>
</svg>
