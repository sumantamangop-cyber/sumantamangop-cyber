<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD89B"/>
      <stop offset="45%" stop-color="#FF9A8B"/>
      <stop offset="75%" stop-color="#5B86C9"/>
      <stop offset="100%" stop-color="#19547B"/>
